<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PocketSmart - Home Interior Planner</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 0; }
    .header { background-color: #1e3a8a; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; font-size: 22px; }
    .nav a { color: white; margin-left: 20px; text-decoration: none; font-weight: bold; }
    .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    .card { background: white; border-radius: 10px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
    .card-title { background: #1e3a8a; color: white; padding: 10px 15px; border-radius: 6px; font-size: 16px; font-weight: bold; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #334155; }
    input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    .btn { background-color: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
    .btn:hover { background-color: #1d4ed8; }
    
    .summary-box { display: flex; justify-content: space-between; background: #e0f2fe; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; color: #0369a1; }
    .category-header { background: #f1f5f9; padding: 8px 12px; border-left: 4px solid #2563eb; margin: 15px 0 10px 0; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 14px; }
    th { background-color: #f8fafc; color: #475569; }
    .shop-btn { background: white; border: 1px solid #cbd5e1; border-radius: 4px; padding: 4px 8px; margin-right: 4px; font-size: 12px; cursor: pointer; text-decoration: none; color: #334155; }
    .shop-btn:hover { background: #f1f5f9; }
  </style>
</head>
<body>

  <div class="header">
    <h1>PocketSmart - Home Interior Planner</h1>
    <div class="nav">
      <a href="/dashboard">Dashboard</a>
      <a href="/home_planner">Home Planner</a>
      <a href="/party_planner">Party Planner</a>
      <a href="/jewelry_planner">Jewelry Planner</a>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-title">Enter Home Planning Details</div>
      <div class="form-group">
        <label>Room Types & Quantities (e.g., 2 Bedrooms, 1 Living Room):</label>
        <input type="text" id="rooms" placeholder="2 bedrooms, living room">
      </div>
      <div class="form-group">
        <label>Total Budget ($ / ₹):</label>
        <input type="number" id="budget" placeholder="23000">
      </div>
      <button class="btn" onclick="generatePlan()">Generate Recommendations</button>
    </div>

    <div id="resultsCard" class="card" style="display: none;">
      <div class="card-title">Your Personalized Budget Plan</div>
      <div id="outputContainer"></div>
    </div>
  </div>
<script>
async function generatePlan() {
  const rooms = document.getElementById('rooms').value.trim();
  const budget = document.getElementById('budget').value.trim();
  const resultsCard = document.getElementById('resultsCard');
  const outputContainer = document.getElementById('outputContainer');

  if (!rooms || !budget) {
    alert("Please fill in all fields.");
    return;
  }

  outputContainer.innerHTML = "<p>Generating budget plan...</p>";
  resultsCard.style.display = "block";

  try {
    const response = await fetch('/generate_home', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rooms, budget })
    });

    if (!response.ok) {
      throw new Error(`Server error: ${response.status}`);
    }

    const data = await response.json();

    if (data.error) {
      outputContainer.innerHTML = `<p style="color:red;">Error: ${data.error}</p>`;
      return;
    }

    // Direct Object illana String-a irundha parse pannum
    const json = typeof data.result === 'string' ? JSON.parse(data.result) : data.result;

    let html = `
      <div class="summary-box" style="margin-bottom: 20px; padding: 10px; background: #e2e8f0; border-radius: 6px;">
        <p><b>Total Budget:</b> ₹${json.total_budget || budget}</p>
        <p><b>Estimated Remaining:</b> ₹${json.remaining_budget || '0'}</p>
      </div>
    `;

    if (json.categories && Array.isArray(json.categories)) {
      json.categories.forEach(cat => {
        html += `
          <div style="margin-bottom: 20px;">
            <h3 style="color: #1e293b; border-bottom: 2px solid #cbd5e1; padding-bottom: 5px;">
              ${cat.name} (Allocation: ₹${cat.allocation || 'N/A'})
            </h3>
            <table style="width:100%; border-collapse: collapse; margin-top: 10px;">
              <thead>
                <tr style="background-color: #f1f5f9; text-align: left;">
                  <th style="padding: 8px;">Item</th>
                  <th style="padding: 8px;">Description</th>
                  <th style="padding: 8px;">Qty</th>
                  <th style="padding: 8px;">Price</th>
                </tr>
              </thead>
              <tbody>
        `;

        if (cat.items && Array.isArray(cat.items)) {
          cat.items.forEach(item => {
            html += `
              <tr style="border-bottom: 1px solid #e2e8f0;">
                <td style="padding: 8px;"><b>${item.item || item.name}</b></td>
                <td style="padding: 8px;">${item.description || '-'}</td>
                <td style="padding: 8px;">${item.quantity || 1}</td>
                <td style="padding: 8px;">₹${item.price}</td>
              </tr>
            `;
          });
        }

        html += `</tbody></table></div>`;
      });
    }

    outputContainer.innerHTML = html;

  } catch (err) {
    console.error("Home Planner Fetch Error:", err);
    outputContainer.innerHTML = `<p style="color:red;">Failed to render response: ${err.message}</p>`;
  }
}
</script>
  </body>
</html>
