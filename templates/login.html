<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PocketSmart - Login</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 0; }
    .header { background-color: #1e3a8a; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; font-size: 22px; }
    .nav a { color: white; margin-left: 20px; text-decoration: none; font-weight: bold; }
    .container { max-width: 400px; margin: 60px auto; padding: 0 20px; }
    .card { background: white; border-radius: 10px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .card-title { font-size: 20px; font-weight: bold; color: #1e3a8a; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #334155; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    .btn { background-color: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    .btn:hover { background-color: #1d4ed8; }
    .error { color: #dc2626; font-size: 14px; margin-bottom: 15px; text-align: center; }
    .footer-text { text-align: center; margin-top: 15px; font-size: 14px; color: #64748b; }
    .footer-text a { color: #2563eb; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <h1>PocketSmart</h1>
    <div class="nav">
      <a href="/">Home</a>
      <a href="/register">Register</a>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-title">Login to PocketSmart</div>
      
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <form action="/login" method="POST">
        <div class="form-group">
          <label>Username:</label>
          <input type="text" name="username" required placeholder="Enter your username">
        </div>
        <div class="form-group">
          <label>Password:</label>
          <input type="password" name="password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn">Login</button>
      </form>

      <div class="footer-text">
        Don't have an account? <a href="/register">Register here</a>
      </div>
    </div>
  </div>

</body>
</html>
