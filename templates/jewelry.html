<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry Planner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #eef2f5;
        }

        /* Top Navigation Bar */
        .navbar {
            background-color: #1a2332;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }

        .navbar .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .navbar ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .navbar ul li a {
            color: #b0bec5;
            text-decoration: none;
            font-size: 14px;
        }

        .navbar ul li a.active {
            color: white;
            font-weight: bold;
        }

        /* Main Container */
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        /* Form Card Header */
        .card-header {
            background-color: #1a2332;
            color: white;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            background-color: #f9fbfd;
            font-size: 14px;
            color: #555;
            outline: none;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: #007bff;
            background-color: #fff;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <div class="navbar">
        <div class="logo">Jewelry Planner</div>
        <ul>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Gold Savings</a></li>
            <li><a href="#" class="active">Jewelry Planner</a></li>
            <li><a href="#">Wishlist</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="card-header">
            Jewelry Budget Planner
        </div>

        <form>
            <!-- Jewelry Category / Event -->
            <div class="form-group">
                <label for="jewelry-type">Jewelry Type / Occasion:</label>
                <select id="jewelry-type">
                    <option value="" disabled selected>Select option (e.g., Bridal Set / Daily Wear)</option>
                    <option value="wedding">Bridal / Wedding Set</option>
                    <option value="bangle">Gold Bangles & Chains</option>
                    <option value="diamond">Diamond Collection</option>
                    <option value="daily">Daily Wear / Gift</option>
                </select>
            </div>

            <!-- Target Gold Weight / Quantity -->
            <div class="form-group">
                <label for="weight">Target Weight (Sovereign / Grams) or Items:</label>
                <input type="text" id="weight" placeholder="e.g. 8 Grams / 1 Sovereign / 2 Items">
            </div>

            <!-- Total Budget -->
            <div class="form-group">
                <label for="budget">Total Budget (₹):</label>
                <input type="number" id="budget" placeholder="e.g. 50000">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Generate Jewelry Plan</button>
        </form>
    </div>

</body>
</html>
